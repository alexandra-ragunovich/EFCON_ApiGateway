spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        - id: user_service
          uri: http://user-service:8083
          predicates:
            - Path=/api/users/**

        - id: road_service
          uri: http://road-service:8085
          predicates:
            - Path=/api/road/**

        - id: favorite_route
          uri: http://favorite-service:8086
          predicates:
            - Path=/api/favorite/**


        - id: diary_service
          uri: http://diary-service:8082
          predicates:
            - Path=/api/posts/**


        - id: integration_service
          uri: http://integration-service:8084
          predicates:
            - Path=/api/integration/**

server:
  port: 8080

jwt:
  secret: "KakoitoTExtForKeyTobeSavedIdontknowhelp"
